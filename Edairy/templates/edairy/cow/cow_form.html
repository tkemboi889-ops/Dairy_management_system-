{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add Cow</h2>

    <div class="card mt-3">
        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Cow
                </button>

                <a href="{% url 'cows_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
