{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add Farmer</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Farmer
        </button>

        <a href="{% url 'farmers_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
