{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Delete Milk Record</h2>

    <p>
        Are you sure you want to delete the milk record
        containing <strong>{{ object.amount_in_litres }} litres</strong>
        from <strong>{{ object.cow.name }}</strong>?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'milk_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
