{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Worker Details</h2>

    <div class="card mt-3">

        <div class="card-body">

            <p>
                <strong>Username:</strong>
                {{ object.user.username }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ object.phone_number }}
            </p>

            <p>
                <strong>Assigned Cows:</strong>
            </p>

            <ul>

                {% for cow in object.cows.all %}

                    <li>{{ cow.name }}</li>

                {% empty %}

                    <li>No cows assigned</li>

                {% endfor %}

            </ul>

            <a href="{% url 'update_workers' object.pk %}"
               class="btn btn-warning">
                Edit
            </a>

            <a href="{% url 'delete_worker' object.pk %}"
               class="btn btn-danger">
                Delete
            </a>

            <a href="{% url 'workers_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

{% endblock %}
