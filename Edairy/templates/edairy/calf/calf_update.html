{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Update Calf</h2>

    <div class="card">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Update Calf
                </button>

                <a href="{% url 'calfs_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
