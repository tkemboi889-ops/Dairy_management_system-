{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Calf Details</h2>

    <div class="card">

        <div class="card-body">

            <h4>{{ object.name }}</h4>

            <hr>

            <p>
                <strong>Name:</strong>
                {{ object.name }}
            </p>

            <p>
                <strong>Breed:</strong>
                {{ object.breed }}
            </p>

            <p>
                <strong>Sex:</strong>
                {{ object.get_sex_display }}
            </p>

            <p>
                <strong>Age:</strong>
                {{ object.age }}
            </p>

            <p>
                <strong>Mother Cow:</strong>
                {{ object.cow.name }}
            </p>

            <a href="{% url 'update_calfs' object.pk %}"
               class="btn btn-warning">
                Edit
            </a>

            <a href="{% url 'delete_calf' object.pk %}"
               class="btn btn-danger">
                Delete
            </a>

            <a href="{% url 'calfs_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

{% endblock %}
