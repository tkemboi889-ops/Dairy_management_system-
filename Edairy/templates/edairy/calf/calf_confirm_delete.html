{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-body">

            <h3>Delete Calf</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ object.name }}</strong>?
            </p>

            <form method="post">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'calfs_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
