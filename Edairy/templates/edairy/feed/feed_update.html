{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Update Feed</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update Feed
        </button>

        <a href="{% url 'feeds_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
